<!DOCTYPE html>
<!-- BL-363 — the browser client's page. Unity fills the triple-brace tokens at build time (⚠ never write one in a comment: it is evaluated); the server serves the
     result at /play. signalr.min.js is Microsoft's JavaScript SignalR client (@microsoft/signalr 8.0.7, MIT),
     which Plugins/WebGL/SignalRBridge.jslib drives. The canvas fills the window. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0d1014; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #0d1014; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
                 justify-content: center; gap: 14px; color: #d8cfb8; font: 16px system-ui, sans-serif; }
      #bar { width: min(420px, 80vw); height: 8px; border-radius: 4px; background: #2a2f36; overflow: hidden; }
      #fill { width: 0; height: 100%; background: #c9a24a; transition: width .2s; }
    </style>
    <script src="signalr.min.js"></script>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><div>Loading {{{ PRODUCT_NAME }}} …</div><div id="bar"><div id="fill"></div></div>
      <small id="note">The first visit downloads the game; later visits load from the browser's cache.</small></div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      // Right-drag turns the camera: keep the browser's own context menu off the game.
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }, function (progress) {
        document.querySelector("#fill").style.width = (100 * progress) + "%";
      }).then(function () {
        document.querySelector("#loading").remove();
        canvas.focus();
      }).catch(function (message) {
        document.querySelector("#note").textContent = "Could not start: " + message;
      });
    </script>
  </body>
</html>
